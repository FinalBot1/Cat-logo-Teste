<script>

function atualizarLayoutTreinamento(){

    const titulo =
        document.getElementById("titulo");

    const controles =
        document.getElementById("controls");

    const imgTreinamento =
        document.getElementById("textoTreinamento");

    const escala =
        window.innerWidth / 1920;

    const espaco =
        5 * escala;

    const tituloBottom =
        titulo.offsetTop +
        titulo.offsetHeight;

    const controlesTop =
        controles.offsetTop;

    const topoImagem =
        tituloBottom +
        espaco;

    imgTreinamento.style.top =
        topoImagem + "px";

    const imagemHeight =
        imgTreinamento.offsetHeight;

    const espacoInferior =
        controlesTop -
        (topoImagem + imagemHeight);

    if(espacoInferior > 0){

        imgTreinamento.style.height =
            (imagemHeight +
            (espacoInferior - espaco) / 2)
            + "px";

        imgTreinamento.style.width =
            "30vw";
    }

    const btnInfo =
    document.getElementById("btnInfo");

btnInfo.style.top =
    (
        titulo.offsetTop +
        (titulo.offsetHeight / 2) -
        (btnInfo.offsetHeight / 2) +
        (window.innerWidth * 0.001)
    ) + "px";
}

window.addEventListener(
    "load",
    atualizarLayoutTreinamento
);

window.addEventListener(
    "resize",
    atualizarLayoutTreinamento
);


const imgInfo =
    document.getElementById("imgInfo");


const imgTreinamento =
    document.getElementById(
        "imgTreinamento"
    );

let imagemAnteriorInfo = "";

document.getElementById("btnInfo")
.addEventListener("mouseenter",()=>{

    imgInfo.src =
        "../Assets/Botoes/Informação_highlight.gif";

    imagemAnteriorInfo =
        imgTreinamento.src;

    imgTreinamento.src =
        "./Files/Imagens/Info_Assemblies_Penta.png";

});


document.getElementById("btnInfo")
.addEventListener("mouseleave",()=>{

    imgInfo.src =
        "../Assets/Botoes/Informação.gif";

    imgTreinamento.src =
        imagemAnteriorInfo;

});

    }else{

        sliderContainer.style.display = "flex";

});

const imgTema3D =

function atualizarImagemTema(){

    const temaEscuro =
        localStorage.getItem("temaEscuro") === "true";

    imgTema3D.src =
        temaEscuro
            ? "../Assets/Botoes/Tema_n.gif"
            : "../Assets/Botoes/Tema.gif";
}

function aplicarTema(){

    const temaEscuro =
        localStorage.getItem("temaEscuro") === "true";

    const cor =
        temaEscuro
            ? "#6E6E6E"
            : "#f5f5f5";

    document.body.style.backgroundColor =
        cor;

    document.documentElement.style.backgroundColor =
        cor;

    if(window.alterarTema3D){

        window.alterarTema3D(
            temaEscuro
                ? 0x6E6E6E
                : 0xf5f5f5
        );

    }

    atualizarImagemTema();
}


aplicarTema();

document.getElementById("btnTema3D")
.addEventListener("mouseenter",()=>{

    const temaEscuro =
        localStorage.getItem("temaEscuro") === "true";

    imgTema3D.src =
        temaEscuro
            ? "../Assets/Botoes/Tema_highlight_n.gif"
            : "../Assets/Botoes/Tema_highlight.gif";

});

document.getElementById("btnTema3D")
.addEventListener("mouseleave",()=>{

    atualizarImagemTema();

});

document.getElementById("btnTema3D")
.addEventListener("click",()=>{

    const temaAtual =
        localStorage.getItem("temaEscuro") === "true";

    localStorage.setItem(
        "temaEscuro",
        !temaAtual
    );

    aplicarTema();

});

</script>
