<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Página Nova</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fff;
      font-family: Arial, sans-serif;
    }

    #logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 18vw;
      height: auto;
      max-width: 250px;
      max-height: 88px;
    }

    #textos-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0;
    }

    #catalogo-texto {
      font-weight: bold;
      color: #333;
      font-size: calc(32.4 / 80 * var(--logo-height));
      line-height: 1;
    }

    #menu-texto {
      font-weight: bold;
      color: #006400;
      text-decoration: underline;
      font-size: calc(27 / 80 * var(--logo-height));
      margin-top: calc(5 / 80 * var(--logo-height));
      line-height: 1;
    }

    #imagens-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
      width: calc(100% - 20px);
      max-width: 1920px;
      background-color: #fff;
    }

    .imagem-item {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .imagem-item img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .codigo-overlay {
      position: absolute;
      top: 0.5%;
      left: 1%;
      font-size: 12px;
      line-height: 1.2;
      font-weight: bold;
      text-align: left;
      pointer-events: none;
      color: #004aad;
      transition: color 0.2s ease;
    }

    .botoes-container {
      position: absolute;
      bottom: 5px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 0 5px;
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .btn-3d {
      background-color: #ff7a00;
      color: #ffffff;
      border-radius: 4px;
      border: 1px solid transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-3d:hover {
      background-color: #ffffff;
      color: #ff7a00;
      border: 1px solid #ff7a00;
    }

    .btn-manut {
      background-color: #006400;
      color: #ffffff;
      border-radius: 4px;
      border: 1px solid transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-manut:hover {
      background-color: #ffffff;
      color: #006400;
      border: 1px solid #006400;
    }

    .em-construcao {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgb(253, 0, 0);
      font-weight: bold;
      text-align: center;
      display: none;
      pointer-events: none;
      max-width: 98%;
      width: calc(98%);
      font-size: 150%; /* Aumentado 50% em relação ao anterior */
    }

    @media only screen and (max-width: 768px) {
      body {
        min-height: 100vh;
        overflow-x: hidden;
      }

      body.landscape::before {
        content: "Por favor, vire o celular para retrato";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-size: 18px;
        text-align: center;
        padding: 20px;
      }

      #imagens-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: auto;
        gap: 5px;
        width: 100%;
        height: calc(100vh - 120px);
        overflow-y: auto;
        left: 0;
        transform: none;
        padding: 10px;
      }

      #imagens-container img {
        width: 100%;
        height: auto;
        display: block;
      }

      .botoes-container button {
        width: 40%;
        height: auto;
        font-size: 0.8em;
      }
    }
  </style>
</head>
<body>

  <a href="http://www.niagara.com.br" target="_blank" rel="noopener noreferrer">
    <img id="logo" src="Assets/Imagens/logo-niagara.png" alt="Logo Niagara">
  </a>

  <div id="textos-container">
    <div id="catalogo-texto">Catálogo - Válvulas de Alumina</div>
    <div id="menu-texto">Menu</div>
  </div>

  <div id="imagens-container">
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
    <div class="imagem-item"></div>
  </div>

  <script>
    const logo = document.getElementById('logo');
    const textos = document.getElementById('textos-container');
    const menu = document.getElementById('menu-texto');
    const container = document.getElementById('imagens-container');

    const imagens = [
      "Assets/Imagens/Menu1.png",
      "Assets/Imagens/Menu2.png",
      "Assets/Imagens/Menu3.png",
      "Assets/Imagens/Menu4.png",
      "Assets/Imagens/Menu5.png",
      "Assets/Imagens/Menu6.png",
      "Assets/Imagens/Menu7.png",
      "Assets/Imagens/Menu8.png",
      "Assets/Imagens/Menu9.png",
      "Assets/Imagens/Menu10.png",
      "Assets/Imagens/Menu11.png",
      "Assets/Imagens/Menu12.png"
    ];

    const textosCodigos = [
      "Código 287<br>AS4-Manual<br>AS4A-Atuador",
      "Código 286<br>AS1-Manual<br>AS1A-Atuador",
      "Código 285<br>AS3-Manual<br>AS3A-Atuador",
      "Código 288<br>AS1-Manual<br>AS1A-Atuador",
      "Código 289<br>AS4.1-Manual<br>AS4.1A-Atuador",
      "Código 289<br>AS4-Manual<br>AS4A-Atuador",
      "Código 287<br>AS14-Manual<br>AS14A-Atuador",
      "Código 289<br>AS10-Manual<br>AS10A-Atuador",
      "Código 288<br>AS4.3-Manual<br>AS4.3A-Atuador",
      "Código 287<br>AS4.5-Manual<br>AS4.5A-Atuador",
      "Código CH5",
      "Código CH7"
    ];

    const items = document.querySelectorAll('.imagem-item');

    items.forEach((item, index) => {
      const img = document.createElement('img');
      const originalSrc = imagens[index];
      // Alteração aplicada apenas para a primeira imagem
      const hoverSrc = (index === 0) ? "Assets/Imagens/Menu1AA.gif" : originalSrc.replace('.png', 'A.gif');

      img.src = originalSrc;
      img.alt = `Menu ${index + 1}`;
      item.appendChild(img);

      const codigo = document.createElement('div');
      codigo.className = 'codigo-overlay';
      codigo.innerHTML = textosCodigos[index];
      item.appendChild(codigo);

      const emConstrucao = document.createElement('div');
      emConstrucao.className = 'em-construcao';
      emConstrucao.innerText = 'Em construção';
      item.appendChild(emConstrucao);

      const botoes = document.createElement('div');
      botoes.className = 'botoes-container';

      const btn3d = document.createElement('button');
      btn3d.innerText = 'Desenho 3D';
      btn3d.className = 'btn-3d';

      const btnManut = document.createElement('button');
      btnManut.innerText = 'Treinamento';
      btnManut.className = 'btn-manut';

      if (index === 1) {
        btn3d.onclick = () => window.location.href = "3D.html";
        btnManut.onclick = () => window.location.href = "Treinamento.html";
      }

      botoes.appendChild(btn3d);
      botoes.appendChild(btnManut);
      item.appendChild(botoes);

      item.addEventListener('mouseenter', () => {
        botoes.style.opacity = '1';
        img.src = hoverSrc;
        codigo.style.color = 'green';
        if (index !== 1) {
          emConstrucao.style.display = 'block';
          emConstrucao.style.width = `${item.getBoundingClientRect().width * 0.98}px`;
        }
      });

      item.addEventListener('mouseleave', () => {
        botoes.style.opacity = '0';
        img.src = originalSrc;
        codigo.style.color = '#004aad';
        emConstrucao.style.display = 'none';
      });
    });

    function atualizarLayout() {
      const logoHeight = logo.getBoundingClientRect().height;
      textos.style.setProperty('--logo-height', `${logoHeight}px`);
      const menuRect = menu.getBoundingClientRect();
      const topContainer = menuRect.bottom + 20;
      const alturaContainer = window.innerHeight - 10 - topContainer;
      container.style.top = `${topContainer}px`;
      container.style.height = `${alturaContainer}px`;
    }

    function atualizarBotoes() {
      items.forEach(item => {
        const botoes = item.querySelectorAll('button');
        const larguraItem = item.getBoundingClientRect().width;
        botoes.forEach(btn => {
          const larguraBotao = larguraItem * 0.45;
          const alturaBotao = larguraBotao * 0.25;
          btn.style.width = `${larguraBotao}px`;
          btn.style.height = `${alturaBotao}px`;
          btn.style.fontSize = `${alturaBotao * 0.4}px`;
        });
      });
    }

    function checkOrientation() {
      if(window.innerHeight < window.innerWidth){
        document.body.classList.add('landscape');
      } else {
        document.body.classList.remove('landscape');
      }
    }

    window.addEventListener('load', () => {
      atualizarLayout();
      atualizarBotoes();
      checkOrientation();
    });

    window.addEventListener('resize', () => {
      atualizarLayout();
      atualizarBotoes();
      checkOrientation();
    });
  </script>

</body>
</html>
